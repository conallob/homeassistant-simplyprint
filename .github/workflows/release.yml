name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the commit the tag points to, not the tag itself,
          # so we can push the version bump back to the default branch.
          ref: ${{ github.event.release.target_commitish }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        # Tags must be plain semver: 1.2.3  (no leading "v")
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' \
            custom_components/simplyprint/manifest.json \
            > manifest.tmp \
            && mv manifest.tmp custom_components/simplyprint/manifest.json
          echo "Set manifest version to ${VERSION}"
          cat custom_components/simplyprint/manifest.json

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/simplyprint/manifest.json
          git diff --cached --quiet || git commit -m "chore: bump manifest version to ${{ steps.version.outputs.version }}"
          git push

      - name: Bundle integration zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd custom_components
          zip -r "../simplyprint-${VERSION}.zip" simplyprint/
          cd ..

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: simplyprint-*.zip
